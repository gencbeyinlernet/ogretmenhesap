name: GitHub Pages yayını
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - name: Yayın dosyalarını hazırla
        run: |
          mkdir _site
          cp index.html style.css app.js backend.js project-workspace.js _site/
          cp -r vendor deployment _site/
          mkdir _site/supabase
          cp supabase/*.sql _site/supabase/
          mkdir -p _site/supabase/functions/_shared
          cp supabase/functions/_shared/project-rules.js _site/supabase/functions/_shared/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Yayımla
        id: deployment
        uses: actions/deploy-pages@v4
